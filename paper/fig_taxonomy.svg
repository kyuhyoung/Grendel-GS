<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img"
     aria-label="OOM 분류에 따른 대응 흐름: 즉시 용량 초과·파편화·성장·상속 초과가 각기 다른 경로로 처리되고, 성장형만 학습분을 자식에게 상속한다"
     style="max-width:100%;height:auto;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1a1a1a">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <!-- 학습 -->
  <rect x="24" y="176" width="150" height="60" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="99" y="200" text-anchor="middle" font-size="13" fill="currentColor">타일 학습</text>
  <text x="99" y="219" text-anchor="middle" font-size="11" opacity="0.7" fill="currentColor">(예측·감시 없음)</text>

  <line x1="174" y1="206" x2="232" y2="206" stroke="currentColor" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="203" y="197" text-anchor="middle" font-size="11" fill="currentColor">OOM</text>

  <!-- 분류기 -->
  <polygon points="310,166 386,206 310,246 234,206" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text x="310" y="202" text-anchor="middle" font-size="12" fill="currentColor">분류</text>
  <text x="310" y="218" text-anchor="middle" font-size="10" opacity="0.7" fill="currentColor">iter vs densify</text>

  <!-- Cat1 -->
  <line x1="310" y1="166" x2="310" y2="70" stroke="currentColor" stroke-width="1.4"/>
  <line x1="310" y1="70" x2="600" y2="70" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="420" y="61" text-anchor="middle" font-size="11" fill="currentColor">Cat1 · iter≈1 · 이미지 작업셋</text>
  <rect x="600" y="46" width="170" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="685" y="68" text-anchor="middle" font-size="12" fill="currentColor">즉시 분할</text>
  <text x="685" y="84" text-anchor="middle" font-size="10" opacity="0.7" fill="currentColor">자식 = 맨바닥</text>

  <!-- Cat2 -->
  <line x1="310" y1="166" x2="310" y2="132" stroke="currentColor" stroke-width="1.4"/>
  <line x1="310" y1="132" x2="600" y2="132" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="430" y="123" text-anchor="middle" font-size="11" fill="currentColor">Cat2 · densify 이전 · 파편화</text>
  <rect x="600" y="108" width="170" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="685" y="130" text-anchor="middle" font-size="12" fill="currentColor">제자리 재시도</text>
  <text x="685" y="146" text-anchor="middle" font-size="10" opacity="0.7" fill="currentColor">전진 없으면 분할</text>

  <!-- Cat3 (강조) -->
  <line x1="386" y1="206" x2="600" y2="206" stroke="#c2410c" stroke-width="2.2" marker-end="url(#arh)"/>
  <text x="470" y="197" text-anchor="middle" font-size="11.5" fill="#c2410c" font-weight="600">Cat3 · densify 이후 · 성장</text>
  <text x="470" y="228" text-anchor="middle" font-size="10" fill="#c2410c" opacity="0.85">예측 불가 — 필연적으로 감수</text>
  <rect x="600" y="180" width="170" height="52" rx="6" fill="none" stroke="#c2410c" stroke-width="2"/>
  <text x="685" y="202" text-anchor="middle" font-size="12" fill="#c2410c" font-weight="600">긴급 저장 → 분할</text>
  <text x="685" y="219" text-anchor="middle" font-size="10" fill="#c2410c">자식 = warm-start</text>

  <!-- Cat4 -->
  <line x1="310" y1="246" x2="310" y2="292" stroke="currentColor" stroke-width="1.4"/>
  <line x1="310" y1="292" x2="600" y2="292" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="430" y="283" text-anchor="middle" font-size="11" fill="currentColor">Cat4 · 로드 시점 · 상속 초과</text>
  <rect x="600" y="268" width="170" height="48" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="685" y="290" text-anchor="middle" font-size="12" fill="currentColor">재분할</text>
  <text x="685" y="306" text-anchor="middle" font-size="10" opacity="0.7" fill="currentColor">상속 유지</text>

  <!-- 인프라 -->
  <line x1="310" y1="246" x2="310" y2="352" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="310" y1="352" x2="600" y2="352" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="430" y="343" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.75">환경 실패 · GPU 유실</text>
  <rect x="600" y="330" width="170" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="685" y="351" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.85">재시도 → 컨테이너 재기동</text>
  <text x="685" y="366" text-anchor="middle" font-size="10" opacity="0.65" fill="currentColor">state resume</text>

  <!-- 자식 큐로 회귀 -->
  <line x1="770" y1="70" x2="880" y2="70" stroke="currentColor" stroke-width="1.4"/>
  <line x1="770" y1="132" x2="880" y2="132" stroke="currentColor" stroke-width="1.4"/>
  <line x1="770" y1="206" x2="880" y2="206" stroke="#c2410c" stroke-width="2"/>
  <line x1="770" y1="292" x2="880" y2="292" stroke="currentColor" stroke-width="1.4"/>
  <line x1="770" y1="352" x2="880" y2="352" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="880" y1="70" x2="880" y2="418" stroke="currentColor" stroke-width="1.4"/>
  <line x1="880" y1="418" x2="99" y2="418" stroke="currentColor" stroke-width="1.4"/>
  <line x1="99" y1="418" x2="99" y2="236" stroke="currentColor" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="490" y="410" text-anchor="middle" font-size="11" fill="currentColor">타일 큐로 복귀 — 하드웨어가 요구하는 깊이까지 재귀</text>

  <text x="24" y="450" font-size="10.5" opacity="0.7" fill="currentColor">
    분류에 필요한 것은 실패 iteration 과 densify 스케줄의 상대 위치뿐 — 메모리 내부 관측 없음.
  </text>
</svg>
