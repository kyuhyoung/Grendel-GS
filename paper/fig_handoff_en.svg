<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img"
     aria-label="Cat3 crash-tolerant handoff sequence: the detecting rank writes the category and cut position into shared memory and notifies peers with SIGUSR1; each rank filters its shard against the two child boxes and saves; the wrapper verifies via headers; the children then read the rank files directly."
     style="max-width:100%;height:auto;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1a1a1a">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="a2h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <!-- lane headers -->
  <text x="90"  y="28" text-anchor="middle" font-size="12.5" font-weight="600" fill="currentColor">rank 0 (detector)</text>
  <text x="330" y="28" text-anchor="middle" font-size="12.5" font-weight="600" fill="currentColor">rank 1·2</text>
  <text x="580" y="28" text-anchor="middle" font-size="12.5" font-weight="600" fill="currentColor">shared memory / disk</text>
  <text x="850" y="28" text-anchor="middle" font-size="12.5" font-weight="600" fill="currentColor">wrapper · children</text>

  <!-- lane lines -->
  <line x1="90"  y1="40" x2="90"  y2="470" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <line x1="330" y1="40" x2="330" y2="470" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <line x1="580" y1="40" x2="580" y2="470" stroke="currentColor" stroke-width="1" opacity="0.35"/>
  <line x1="850" y1="40" x2="850" y2="470" stroke="currentColor" stroke-width="1" opacity="0.35"/>

  <!-- 1. OOM -->
  <rect x="30" y="58" width="120" height="34" rx="5" fill="none" stroke="#c2410c" stroke-width="1.8"/>
  <text x="90" y="80" text-anchor="middle" font-size="11.5" fill="#c2410c">OOM (growth)</text>

  <!-- 2. compute cut -->
  <rect x="24" y="106" width="132" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="90" y="124" text-anchor="middle" font-size="11" fill="currentColor">compute median cut</text>
  <text x="90" y="139" text-anchor="middle" font-size="9.5" opacity="0.7" fill="currentColor">200K sample, on GPU</text>

  <!-- 3. write shared memory -->
  <line x1="156" y1="126" x2="500" y2="126" stroke="#c2410c" stroke-width="1.8" marker-end="url(#a2h)"/>
  <text x="330" y="118" text-anchor="middle" font-size="10.5" fill="#c2410c">write category + cut (mmap)</text>
  <rect x="500" y="106" width="160" height="40" rx="5" fill="none" stroke="#c2410c" stroke-width="1.6"/>
  <text x="580" y="124" text-anchor="middle" font-size="11" fill="#c2410c">OOMState</text>
  <text x="580" y="139" text-anchor="middle" font-size="9.5" fill="#c2410c" opacity="0.85">collectives unusable</text>

  <!-- 4. SIGUSR1 -->
  <line x1="156" y1="176" x2="270" y2="176" stroke="currentColor" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="213" y="168" text-anchor="middle" font-size="10.5" fill="currentColor">SIGUSR1</text>
  <rect x="270" y="158" width="120" height="36" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="330" y="180" text-anchor="middle" font-size="11" fill="currentColor">wake up</text>

  <!-- 5. read cut -->
  <line x1="500" y1="212" x2="392" y2="212" stroke="currentColor" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="446" y="204" text-anchor="middle" font-size="10.5" fill="currentColor">read the same cut</text>

  <!-- 6. each rank saves -->
  <rect x="24" y="238" width="132" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="90" y="258" text-anchor="middle" font-size="11" fill="currentColor">filter shard → save</text>
  <text x="90" y="273" text-anchor="middle" font-size="9.5" opacity="0.7" fill="currentColor">child A/B bbox</text>
  <rect x="264" y="238" width="132" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="330" y="258" text-anchor="middle" font-size="11" fill="currentColor">filter shard → save</text>
  <text x="330" y="273" text-anchor="middle" font-size="9.5" opacity="0.7" fill="currentColor">identical bbox</text>

  <line x1="156" y1="261" x2="500" y2="261" stroke="currentColor" stroke-width="1.4" marker-end="url(#a2)"/>
  <line x1="396" y1="261" x2="500" y2="261" stroke="currentColor" stroke-width="1.4" marker-end="url(#a2)"/>
  <rect x="500" y="238" width="160" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="580" y="257" text-anchor="middle" font-size="11" fill="currentColor">A_rank{0,1,2}.ply</text>
  <text x="580" y="273" text-anchor="middle" font-size="11" fill="currentColor">B_rank{0,1,2}.ply</text>

  <!-- SIGTERM guard -->
  <line x1="90" y1="284" x2="90" y2="316" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="100" y="304" font-size="10" fill="currentColor" opacity="0.8">SIGTERM arrives → guard stands aside → save resumes and completes</text>

  <!-- 7. verify -->
  <line x1="660" y1="330" x2="790" y2="330" stroke="currentColor" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="725" y="322" text-anchor="middle" font-size="10.5" fill="currentColor">header check (ms)</text>
  <rect x="790" y="310" width="140" height="40" rx="5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="860" y="328" text-anchor="middle" font-size="11" fill="currentColor">verify count sum</text>
  <text x="860" y="343" text-anchor="middle" font-size="9.5" opacity="0.7" fill="currentColor">no merge</text>

  <!-- 8. children load -->
  <line x1="790" y1="392" x2="660" y2="392" stroke="#c2410c" stroke-width="1.8" marker-end="url(#a2h)"/>
  <text x="725" y="384" text-anchor="middle" font-size="10.5" fill="#c2410c">children read rank files directly</text>
  <rect x="790" y="372" width="140" height="44" rx="5" fill="none" stroke="#c2410c" stroke-width="1.8"/>
  <text x="860" y="391" text-anchor="middle" font-size="11" fill="#c2410c">children warm-start</text>
  <text x="860" y="406" text-anchor="middle" font-size="9.5" fill="#c2410c" opacity="0.85">inherit trained state</text>

  <text x="24" y="448" font-size="10.5" opacity="0.75" fill="currentColor">
    Ranks may be blocked inside a collective, so NCCL is unusable — coordination uses mmap and POSIX signals only.
  </text>
  <text x="24" y="466" font-size="10.5" opacity="0.75" fill="currentColor">
    One rank computes and broadcasts the cut, so every rank filters against identical child boxes (a mismatch would corrupt data silently).
  </text>
</svg>
